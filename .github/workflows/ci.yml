name: CI

# Doctrine (FAF ecosystem):
#   - "test" gate: base config (.[dev], zero-crypto). Proves the base SDK +
#     Provable Receipt work with NO optional deps. Sign tests skip here.
#   - "sign" gate: .[sign,dev]. Proves optional Ed25519 Verifiable Provenance.
#     Both gates are real — red = actionable failure.
#   - Lint runs continue-on-error (visibility, not a gate).
#   - Compat matrix runs continue-on-error (Python version drift = observability).
#   - Live memory.faf.one test is gated by MCPAAS_LIVE and workflow_dispatch-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # THE GATE. Single Python, offline tests only (the live namepoint test
  # auto-skips without MCPAAS_LIVE). Red = real.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (offline)
        run: pytest -v

  # THE PROVENANCE GATE. Installs the [sign] extra so the Ed25519 sign/verify
  # suite runs (it skips in the base "test" job). Red = signing is broken.
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + [sign] + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sign,dev]"

      - name: Test (offline, with signing)
        run: pytest -v

  # Advisory only. Reports issues, never blocks the badge.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Pin to match local .venv (avoids silent RUF rule drift on unpinned latest)
          pip install 'ruff==0.16.0'

      - name: Ruff check (advisory)
        run: ruff check .

  # Observational. Spots Python version drift. Never gates the badge.
  compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (offline)
        run: pytest -v

  # Live memory.faf.one round-trip. Manual trigger only.
  test-live:
    name: Test (live memory.faf.one)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + namepoint extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,namepoint]"

      - name: Test (live namepoint pull)
        env:
          MCPAAS_LIVE: "1"
        run: pytest -v

  # TAF — Test Receipt Printer (sister of FAF). Proof over time on git.
  # Prints one append-only receipt to .taf on the taf-receipts branch per main push.
  # Docs: https://github.com/Wolfe-Jam/faf-taf-git · not FAF; does not store test commands.
  taf:
    name: TAF Receipt
    runs-on: ubuntu-latest
    needs: test
    # always() so FAILED runs still print a receipt (gap on red is also a signal;
    # a FAILED line is stronger longitudinal proof than silence).
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (capture for TAF)
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          # junitxml = reliable counts; tee keeps human log for forensics
          pytest -q --tb=no --junitxml=/tmp/junit.xml 2>&1 | tee /tmp/test-output.txt

      - name: Normalize pytest/junit summary for TAF parser
        run: |
          # faf-taf-git Jest parser wants: "Tests: N passed, M total" (optional failed/skipped)
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit = Path("/tmp/junit.xml")
          if not junit.is_file():
              raise SystemExit("missing /tmp/junit.xml — pytest did not write junit")

          root = ET.parse(junit).getroot()
          # <testsuites> or single <testsuite>
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          passed = failed = skipped = errors = 0
          for s in suites:
              t = int(s.attrib.get("tests", 0) or 0)
              f = int(s.attrib.get("failures", 0) or 0)
              e = int(s.attrib.get("errors", 0) or 0)
              sk = int(s.attrib.get("skipped", 0) or 0)
              failed += f
              errors += e
              skipped += sk
              passed += max(0, t - f - e - sk)

          failed_total = failed + errors
          total = passed + failed_total + skipped
          if total == 0:
              raise SystemExit("junitxml has zero tests")

          parts = []
          if failed_total:
              parts.append(f"{failed_total} failed")
          if skipped:
              parts.append(f"{skipped} skipped")
          parts.append(f"{passed} passed")
          parts.append(f"{total} total")
          line = "Tests: " + ", ".join(parts)
          Path("/tmp/test-output.txt").write_text(
              Path("/tmp/test-output.txt").read_text(errors="replace") + "\n" + line + "\n",
              encoding="utf-8",
          )
          print(line)
          PY

      - name: Print TAF receipt
        uses: Wolfe-Jam/faf-taf-git@v2.2.2
        with:
          test-output-file: /tmp/test-output.txt
          auto-commit: "true"
          commit-message: "chore(taf): update .taf receipt [skip ci]"
          target-branch: taf-receipts
