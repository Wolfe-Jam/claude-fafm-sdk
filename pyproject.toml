[project]
name = "claude-fafm-sdk"
dynamic = ["version"]  # single source: claude_fafm_sdk/__init__.py:__version__
description = "Portable, cross-vendor AI memory in .fafm — offline-first SDK; connect a free namepoint for full intel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "James Wolfe", email = "team@faf.one" }]
keywords = ["ai", "memory", "fafm", "agents", "claude", "portable", "cross-vendor"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
namepoint = [
    "fastmcp>=3.2",   # hosted reads/writes via MCPaaS — the family-standard MCP client
]
sign = [
    "cryptography>=42",  # Ed25519 Verifiable Provenance (1.4) — base + receipt stay zero-crypto
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",  # WJTTC merge + N-version property suites
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://memory.faf.one"
Repository = "https://github.com/Wolfe-Jam/claude-fafm-sdk"
"Format spec" = "https://github.com/Wolfe-Jam/faf"
"Voice profile (grok-faf-voice)" = "https://pypi.org/project/grok-faf-voice/"

[project.scripts]
claude-fafm-sdk = "claude_fafm_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "claude_fafm_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_fafm_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
exclude = ["dist/", "build/", ".venv/", "tests/", "examples/"]

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

# cryptography is the optional [sign] extra — not present when mypy runs on [dev]
[[tool.mypy.overrides]]
module = ["cryptography", "cryptography.*"]
ignore_missing_imports = true

# PEP 561 — typed package for consumers (faf-memory-mcp, etc.)
[tool.hatch.build.targets.wheel.force-include]
"claude_fafm_sdk/py.typed" = "claude_fafm_sdk/py.typed"
